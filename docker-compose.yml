services:
  backend_app:
    image: ${DOCKER_IMAGE:-}
    container_name: ${PROJECT_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - .env
    ports:
      - "${WEB_PORT}:8000"
    restart: unless-stopped
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  backend_network:
    driver: bridge
    name: ${PROJECT_NAME}_network